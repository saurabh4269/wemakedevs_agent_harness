# heroku.yml — container stack for LOOP TrueForge
# Dockerfile must live at repo root: Heroku sets build context to the Dockerfile dir.
# Keep deploy/trueforge.Dockerfile in sync (Render dockerfilePath).
# Usage: heroku stack:set container -a <app>
# Secrets stay in `heroku config`. Do not put keys here.
setup:
  addons:
    # Create with --version 17 on the CLI so restore from Render Postgres 17 works.
    - plan: heroku-postgresql:essential-0
    - plan: heroku-redis:mini
build:
  docker:
    web: Dockerfile
run:
  web: node dist/scripts/start-hosted-trueforge.js
